name: Editorial RSS Crawler

on:
  schedule:
    # JST 5:30, 7:30 (前日 20:30, 22:30 UTC)
    - cron: '30 20,22 * * *'
    # JST 9:30, 11:30, 13:30, 15:30 (当日 0:30, 2:30, 4:30, 6:30 UTC)
    - cron: '30 0,2,4,6 * * *'
  workflow_dispatch: # 手動実行用ボタン

permissions:
  contents: write

jobs:
  crawl-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Crawler Script
        run: python scraper.py

      - name: Commit and Push Updated RSS
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update editorial RSS feed" && git push)
